apply plugin: 'jacoco'

def androidExclusion = [
        '**/databinding/**/*.*',
        '**/android/databinding/*Binding.*',
        '**/BR.*',
        '**/R.*',
        '**/R$*.*',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*_MembersInjector.*',
        '**/Dagger*Component.*',
        '**/Dagger*Component$Builder.*',
        '**/*Module_*Factory.*',
        '**/*Fragment*.*',
        '**/*Activity*.*',
        '**/*Adapter*.*',
        '**/*ViewPager*.*',
        '**/*ViewHolder*.*',
        '**/*Module*.*'
]

jacoco {
    toolVersion = jacocoSetup.version
}


task jacocoUnitTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {

    def moduleDir = file("${projectDir}/../${jacocoSetup.targetModule}")
    def androidClassesDir = new File(moduleDir, "build/tmp/kotlin-classes/debug")
    def javaClassesDir = new File(moduleDir, "build/classes/kotlin/main")
    def classesDir = androidClassesDir.exists() ? androidClassesDir : javaClassesDir

    classDirectories.setFrom(fileTree(
            dir: classesDir,
            excludes: androidExclusion
    ))

    def srcDirs = []
    def javaSrc = new File(moduleDir, "src/main/java")
    if (javaSrc.exists()) {
        srcDirs << javaSrc
    }
    def kotlinSrc = new File(moduleDir, "src/main/kotlin")
    if (kotlinSrc.exists()) {
        srcDirs << kotlinSrc
    }
    sourceDirectories.setFrom(files(srcDirs))

    executionData.setFrom(files('build/jacoco/testDebugUnitTest.exec'))

}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}
