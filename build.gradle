// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    def props = new Properties()
    def propsFile = new File('local.properties')
    if (propsFile.exists()) {
        new File('local.properties').withInputStream {
            props.load(it)
        }
    }
    ext.jacocoSetup = new Properties()
    ext.jacocoSetup['version'] = "0.8.10"
    ext.jacocoSetup['targetModule'] = "sonic-core"
    ext.sonarSetup = new Properties()
    ext.sonarSetup['version'] = '2.8'
    ext.sonarSetup['projectName'] = 'Sonic'
    ext.sonarSetup['projectKey'] = System.env.SONARPROJECTKEY ?: props.getProperty("sonar.projectKey") ?: ""
    ext.sonarSetup['organizationId'] = System.env.SONARORGANIZATIONID ?: props.getProperty("sonar.organizationId") ?: ""
    ext.sonarSetup['token'] = System.env.SONARTOKEN ?: props.getProperty("sonar.token") ?: ""

    ext.kotlin_version = "2.0.20"
    ext.koin_version = "3.5.6"
    ext.compose_version = "2.0.20"
    ext.compose_version_tools = "1.7.0"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jacoco:org.jacoco.core:${jacocoSetup.version}"
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:${sonarSetup.version}"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.8"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.20' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
